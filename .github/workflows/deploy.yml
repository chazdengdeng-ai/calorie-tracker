name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Debug before install
        run: |
          pwd
          ls -la
          echo "HOME=$HOME"

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund 2>&1 || true
          echo "npm install exit code: $?"

      - name: Debug after install
        run: |
          pwd
          ls -la node_modules/ 2>/dev/null || echo "node_modules not found"
          ls -la node_modules/.bin/ 2>/dev/null || echo ".bin not found"
          cat package.json

      - name: Build with full path
        run: |
          ./node_modules/.bin/vite build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Show dist
        run: ls -la dist/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
